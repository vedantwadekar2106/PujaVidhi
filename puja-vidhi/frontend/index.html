<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Puja Vidhi</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-orange-50">

<!-- 🔱 POPUP -->
<div id="popup" class="fixed inset-0 bg-black bg-opacity-80 flex items-center justify-center hidden z-50">
  <div class="text-white text-4xl font-bold animate-pulse">
    ॐ नमः शिवाय
  </div>
</div>

<audio id="chant" src="assets/om.mp3"></audio>

<!-- 🔶 NAVBAR -->
<header class="bg-white shadow">
  <div class="flex justify-between items-center p-4 max-w-7xl mx-auto">

    <div class="flex items-center gap-2">
      <img src="assets/baba.jpg" class="w-10 h-10 rounded-full">
      <h1 class="text-xl font-bold text-orange-600">Puja Vidhi</h1>
    </div>

    <nav class="space-x-6">
      <a href="#">Home</a>
      <a href="#">Patrika</a>
      <a href="#">Shanti</a>
      <a href="#">Other</a>
    </nav>

  </div>
</header>

<!-- 🔶 PUJA CARDS -->
<section class="max-w-7xl mx-auto py-10 px-4 grid md:grid-cols-3 gap-6">

  <div class="bg-white shadow rounded p-4">
    <h2 class="text-xl font-semibold">Udak Shanti</h2>
    <p>Removes negativity and increases positivity.</p>
  </div>

  <div class="bg-white shadow rounded p-4">
    <h2 class="text-xl font-semibold">Vastu Shanti</h2>
    <p>Brings peace and balance.</p>
  </div>

  <div class="bg-white shadow rounded p-4">
    <h2 class="text-xl font-semibold">Satyanarayan</h2>
    <p>For blessings and harmony.</p>
  </div>

</section>

<!-- 🔥 BHAKTI SECTION (DYNAMIC) -->
<section class="max-w-7xl mx-auto px-4 py-10">
  <h2 class="text-2xl font-bold mb-6">Bhakti Content</h2>

  <div id="bhakti-container" class="grid md:grid-cols-3 gap-6"></div>
</section>

<!-- 🔶 FOOTER -->
<footer class="bg-gray-800 text-white text-center p-6">
  <p>© 2026 Puja Vidhi</p>
</footer>

<script src="js/app.js"></script>

</body>
</html>
