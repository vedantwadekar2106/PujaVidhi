<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Patrika Form</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Remix Icon for icons -->
  <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">
</head>
<body class="bg-gradient-to-br from-amber-50 to-orange-100 flex justify-center items-center min-h-screen p-4">

<div class="bg-white/90 backdrop-blur-sm p-8 rounded-2xl shadow-xl w-full max-w-xl border border-orange-100">
  
  <!-- Header with image inside circle -->
  <div class="text-center mb-8">
    <div class="inline-flex items-center justify-center w-16 h-16 bg-amber-100 rounded-full mb-3 overflow-hidden">
      <!-- 👇 Replace this src with YOUR own image -->
      <img src="./assets/images/baba.jpg" alt="Patrika logo" class="w-full h-full object-cover">
    </div>
    <h2 class="text-3xl font-bold text-gray-800 font-serif">Patrika Form</h2>
    <p class="text-sm text-gray-500 mt-1">Fill in the birth details for your horoscope</p>
  </div>

  <form id="patrikaForm" class="space-y-5">

    <!-- Full Name -->
    <div class="relative">
      <label class="block text-sm font-medium text-gray-700 mb-1">Full Name <span class="text-red-400">*</span></label>
      <div class="relative">
        <i class="ri-user-line absolute left-3 top-1/2 -translate-y-1/2 text-gray-400"></i>
        <input type="text" id="name" placeholder="Enter your full name" class="w-full pl-10 p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-amber-400 focus:border-transparent outline-none transition">
      </div>
      <p class="text-red-500 text-xs mt-1 hidden" id="nameError">Please enter a valid name</p>
    </div>

    <!-- Email -->
<div class="relative">
  <label class="block text-sm font-medium text-gray-700 mb-1">
    Email <span class="text-red-400">*</span>
  </label>
  <div class="relative">
    <i class="ri-mail-line absolute left-3 top-1/2 -translate-y-1/2 text-gray-400"></i>
    <input type="email" id="email" placeholder="Enter your email"
      class="w-full pl-10 p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-amber-400 focus:border-transparent outline-none transition">
  </div>
  <p class="text-red-500 text-xs mt-1 hidden" id="emailError">
    Please enter a valid email
  </p>
</div>

    <!-- Gender -->
    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1">Gender <span class="text-red-400">*</span></label>
      <div class="relative">
        <i class="ri-men-line absolute left-3 top-1/2 -translate-y-1/2 text-gray-400"></i>
        <select id="gender" class="w-full pl-10 p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-amber-400 focus:border-transparent outline-none transition appearance-none bg-white">
          <option value="">Select Gender</option>
          <option>Male</option>
          <option>Female</option>
          <option>Other</option>
        </select>
        <i class="ri-arrow-down-s-line absolute right-3 top-1/2 -translate-y-1/2 text-gray-400 pointer-events-none"></i>
      </div>
    </div>

    <!-- Father & Mother Names -->
    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Father's Name <span class="text-red-400">*</span></label>
        <div class="relative">
          <i class="ri-user-line absolute left-3 top-1/2 -translate-y-1/2 text-gray-400"></i>
          <input type="text" id="fatherName" placeholder="Father name" class="w-full pl-10 p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-amber-400 focus:border-transparent outline-none transition">
        </div>
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Mother's Name <span class="text-red-400">*</span></label>
        <div class="relative">
          <i class="ri-user-line absolute left-3 top-1/2 -translate-y-1/2 text-gray-400"></i>
          <input type="text" id="motherName" placeholder="Mother name" class="w-full pl-10 p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-amber-400 focus:border-transparent outline-none transition">
        </div>
      </div>
    </div>

    <!-- Date of Birth -->
    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1">Date of Birth <span class="text-red-400">*</span></label>
      <div class="relative">
        <i class="ri-calendar-line absolute left-3 top-1/2 -translate-y-1/2 text-gray-400"></i>
        <input type="date" id="dob" class="w-full pl-10 p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-amber-400 focus:border-transparent outline-none transition">
      </div>
    </div>

    <!-- Time of Birth – functional AM / PM selector -->
    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1">Time of Birth <span class="text-red-400">*</span></label>
      <!-- Hidden real input that the original JS reads -->
      <input type="time" id="time" class="hidden" value="00:00">
      
      <!-- Visible custom time selector -->
      <div class="flex items-center gap-2">
        <!-- Hour -->
        <select id="hourSelect" class="p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-amber-400 outline-none bg-white text-center" style="width: 70px;">
          <option value="01">01</option><option value="02">02</option><option value="03">03</option>
          <option value="04">04</option><option value="05">05</option><option value="06">06</option>
          <option value="07">07</option><option value="08">08</option><option value="09">09</option>
          <option value="10">10</option><option value="11">11</option><option value="12" selected>12</option>
        </select>
        <span class="text-xl text-gray-400">:</span>
        <!-- Minute -->
<select id="minuteSelect" class="p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-amber-400 outline-none bg-white text-center" style="width: 70px;"></select>
        <!-- AM / PM -->
        <select id="ampmSelect" class="p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-amber-400 outline-none bg-white text-center font-medium" style="width: 80px;">
          <option value="AM" selected>AM</option>
          <option value="PM">PM</option>
        </select>
      </div>
      <p class="text-xs text-gray-400 mt-1">Select hour, minute and AM/PM</p>
    </div>

    <!-- Place of Birth -->
    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1">Place of Birth <span class="text-red-400">*</span></label>
      <div class="relative">
        <i class="ri-map-pin-line absolute left-3 top-1/2 -translate-y-1/2 text-gray-400"></i>
        <input type="text" id="place" placeholder="City, State, Country" class="w-full pl-10 p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-amber-400 focus:border-transparent outline-none transition">
      </div>
    </div>

    <!-- Patrika Type -->
    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1">Patrika Type <span class="text-red-400">*</span></label>
      <div class="relative">
        <i class="ri-file-list-line absolute left-3 top-1/2 -translate-y-1/2 text-gray-400"></i>
        <select id="type" class="w-full pl-10 p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-amber-400 focus:border-transparent outline-none transition appearance-none bg-white">
          <option value="">Select Patrika Type</option>
          <option value="Black & White">Black & White (₹300)</option>
          <option value="Color">Color (₹500)</option>
        </select>
        <i class="ri-arrow-down-s-line absolute right-3 top-1/2 -translate-y-1/2 text-gray-400 pointer-events-none"></i>
      </div>
      <div class="mt-2 flex items-center gap-2 text-sm text-gray-500">
        <i class="ri-information-line text-amber-500"></i>
        <span>Price: ₹300 (B&W) or ₹500 (Color)</span>
      </div>
    </div>

    <!-- Submit Button -->
    <button type="submit" class="w-full bg-gradient-to-r from-amber-500 to-orange-500 text-white font-semibold py-3 px-6 rounded-lg hover:from-amber-600 hover:to-orange-600 active:scale-[0.98] transition-all duration-200 flex items-center justify-center gap-2 shadow-md">
      <i class="ri-send-plane-fill"></i>
      Submit Details
    </button>

    <p id="status" class="text-center mt-2 text-sm font-medium"></p>
    <p class="text-xs text-center text-gray-400 mt-4">Your details are used only to generate the Patrika.</p>
  </form>
</div>

<!-- Original JavaScript – COMPLETELY UNCHANGED -->
<script src="js/patrika.js"></script>
</body>
</html>
